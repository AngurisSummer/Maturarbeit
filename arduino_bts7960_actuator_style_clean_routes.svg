<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <style>
      .bg { fill: #f6f7fb; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #222; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #555; }
      .box { stroke: #2e3a59; stroke-width: 2; rx: 12; ry: 12; }
      .box-arduino { fill: #e7f3ff; }
      .box-driver { fill: #eaf7f9; }
      .box-psu { fill: #fff6e8; }
      .box-act { fill: #ececec; }
      .box-pot { fill: #ffffff; }
      .pinrect { fill: #fff; stroke: #3a3a3a; stroke-width: 1.2; rx: 4; ry: 4; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #111; font-weight: 700; }
      .sublabel { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #333; }
      .legend { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #333; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #444; }
      .tag { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #555; }

      /* Wires */
      .pwr { stroke: #d40000; stroke-width: 3; fill: none; } /* +12V red */
      .gnd { stroke: #000000; stroke-width: 3; fill: none; } /* GND black */
      .logic { stroke: #1f70cf; stroke-width: 2; fill: none; } /* digital lines */
      .analog { stroke: #2a9d2a; stroke-width: 2; fill: none; } /* pot wiper */
      .motor { stroke: #6b6b6b; stroke-width: 3; fill: none; } /* motor leads */

      .wiretext { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #333; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1100" class="bg"/>
  <text x="40" y="60" class="title">Arduino UNO + BTS7960 — Linear Actuator (Length Control)</text>
  <text x="40" y="86" class="subtitle">Orthogonal, non-crossing routes • Color-coded wires • No arrows • Same visual style</text>

  <!-- PSU at top center -->
  <rect x="760" y="120" width="280" height="140" class="box box-psu"/>
  <text x="900" y="150" text-anchor="middle" class="label">12V DC PSU</text>
  <text x="900" y="170" text-anchor="middle" class="sublabel">+12V / GND</text>
  <rect x="1004" y="188" width="22" height="18" class="pinrect"/><text x="1015" y="201" text-anchor="middle" class="sublabel">+</text>
  <rect x="1004" y="214" width="22" height="18" class="pinrect"/><text x="1015" y="227" text-anchor="middle" class="sublabel">−</text>

  <!-- Fuse inline on +12V -->
  <rect x="1040" y="186" width="90" height="24" class="box"/>
  <text x="1085" y="203" text-anchor="middle" class="sublabel">FUSE</text>

  <!-- +12V bus (red) straight line across top -->
  <path class="pwr" d="M 1130 198 H 1600"/>
  <path class="pwr" d="M 1004 198 H 760"/> <!-- back to left -->

  <!-- GND bus (black) straight line across bottom -->
  <path class="gnd" d="M 100 980 H 1700"/>

  <!-- Arduino UNO left -->
  <rect x="140" y="360" width="360" height="240" class="box box-arduino"/>
  <text x="320" y="388" text-anchor="middle" class="label">Arduino UNO</text>
  <!-- UNO pins (top row) -->
  <rect x="160" y="430" width="42" height="20" class="pinrect"/><text x="181" y="444" text-anchor="middle" class="sublabel">5V</text>
  <rect x="206" y="430" width="54" height="20" class="pinrect"/><text x="233" y="444" text-anchor="middle" class="sublabel">GND</text>
  <rect x="264" y="430" width="44" height="20" class="pinrect"/><text x="286" y="444" text-anchor="middle" class="sublabel">D5</text>
  <rect x="312" y="430" width="44" height="20" class="pinrect"/><text x="334" y="444" text-anchor="middle" class="sublabel">D6</text>
  <rect x="360" y="430" width="44" height="20" class="pinrect"/><text x="382" y="444" text-anchor="middle" class="sublabel">D7</text>
  <rect x="408" y="430" width="44" height="20" class="pinrect"/><text x="430" y="444" text-anchor="middle" class="sublabel">D8</text>
  <rect x="456" y="430" width="44" height="20" class="pinrect"/><text x="478" y="444" text-anchor="middle" class="sublabel">A0</text>

  <!-- BTS7960 center -->
  <rect x="700" y="340" width="360" height="220" class="box box-driver"/>
  <text x="880" y="366" text-anchor="middle" class="label">BTS7960 (IBT-2)</text>
  <!-- Driver pins (top row) -->
  <rect x="720" y="400" width="42" height="20" class="pinrect"/><text x="741" y="414" text-anchor="middle" class="sublabel">VCC</text>
  <rect x="766" y="400" width="42" height="20" class="pinrect"/><text x="787" y="414" text-anchor="middle" class="sublabel">GND</text>
  <rect x="812" y="400" width="54" height="20" class="pinrect"/><text x="839" y="414" text-anchor="middle" class="sublabel">L_EN</text>
  <rect x="870" y="400" width="54" height="20" class="pinrect"/><text x="897" y="414" text-anchor="middle" class="sublabel">R_EN</text>
  <rect x="928" y="400" width="64" height="20" class="pinrect"/><text x="960" y="414" text-anchor="middle" class="sublabel">L_PWM</text>
  <rect x="996" y="400" width="64" height="20" class="pinrect"/><text x="1028" y="414" text-anchor="middle" class="sublabel">R_PWM</text>
  <rect x="928" y="460" width="54" height="20" class="pinrect"/><text x="955" y="474" text-anchor="middle" class="sublabel">M+</text>
  <rect x="988" y="460" width="54" height="20" class="pinrect"/><text x="1015" y="474" text-anchor="middle" class="sublabel">M−</text>

  <!-- Actuator right -->
  <rect x="1180" y="360" width="360" height="200" class="box box-act"/>
  <text x="1360" y="386" text-anchor="middle" class="label">Linear Actuator</text>
  <rect x="1500" y="440" width="40" height="20" class="pinrect"/><text x="1520" y="454" text-anchor="middle" class="sublabel">A</text>
  <rect x="1500" y="470" width="40" height="20" class="pinrect"/><text x="1520" y="484" text-anchor="middle" class="sublabel">B</text>

  <!-- Potentiometer bottom center -->
  <rect x="820" y="760" width="360" height="140" class="box box-pot"/>
  <text x="1000" y="786" text-anchor="middle" class="label">10k Linear Potentiometer</text>
  <text x="1000" y="806" text-anchor="middle" class="sublabel">5V — WIPER — GND</text>
  <rect x="860" y="840" width="56" height="20" class="pinrect"/><text x="888" y="854" text-anchor="middle" class="sublabel">5V</text>
  <rect x="960" y="840" width="70" height="20" class="pinrect"/><text x="995" y="854" text-anchor="middle" class="sublabel">WIPER</text>
  <rect x="1060" y="840" width="60" height="20" class="pinrect"/><text x="1090" y="854" text-anchor="middle" class="sublabel">GND</text>

  <!-- POWER ROUTING (no crossings): bring +12V down to driver VCC, GND to bottom bus -->
  <!-- +12V drop to driver VCC via vertical then horizontal -->
  <path class="pwr" d="M 1004 198 V 380 H 720"/>  <!-- to VCC pin vicinity -->
  <text x="726" y="392" class="wiretext">+12V</text>

  <!-- GND from PSU to bottom GND bus -->
  <path class="gnd" d="M 1004 223 V 980"/>
  <text x="1012" y="970" class="wiretext">GND bus</text>

  <!-- Driver VCC to pin -->
  <path class="pwr" d="M 720 410 H 690 V 380 H 720"/>
  <!-- Driver GND to bottom bus -->
  <path class="gnd" d="M 766 420 V 960"/>  <!-- from driver GND pin down to GND bus -->

  <!-- Arduino GND to GND bus (left vertical) -->
  <path class="gnd" d="M 233 450 V 980"/>
  <!-- Arduino 5V (if powered by buck/USB not shown) just reference to pot 5V -->
  <!-- Pot 5V up to UNO 5V in left channel (no crossing) -->
  <path class="logic" d="M 888 850 H 560 V 440 H 181"/>  <!-- Pot 5V -> UNO 5V -->
  <text x="565" y="448" class="wiretext">5V</text>

  <!-- Pot GND to GND bus (right drop then to bus) -->
  <path class="gnd" d="M 1090 850 V 980"/>

  <!-- Pot Wiper to A0 (own mid lane) -->
  <path class="analog" d="M 995 850 H 740 V 520 H 478"/>  <!-- Wiper -> A0 -->
  <text x="742" y="534" class="wiretext">A0 (Analog)</text>

  <!-- LOGIC ROUTING (separate lanes top-to-bottom to avoid crossing) -->
  <!-- D5 -> L_PWM (upper lane) -->
  <path class="logic" d="M 286 450 H 680 V 410 H 960"/> 
  <text x="300" y="442" class="wiretext">D5 → L_PWM</text>

  <!-- D6 -> R_PWM (second lane) -->
  <path class="logic" d="M 334 450 H 700 V 410 H 1028"/> 
  <text x="340" y="460" class="wiretext">D6 → R_PWM</text>

  <!-- D7 -> L_EN (third lane) -->
  <path class="logic" d="M 382 450 H 820 V 420 H 839"/> 
  <text x="388" y="470" class="wiretext">D7 → L_EN</text>

  <!-- D8 -> R_EN (fourth lane) -->
  <path class="logic" d="M 430 450 H 880 V 420 H 897"/> 
  <text x="436" y="482" class="wiretext">D8 → R_EN</text>

  <!-- MOTOR WIRES short and separated -->
  <path class="motor" d="M 955 470 H 1500"/>
  <path class="motor" d="M 1015 470 H 1500"/>

  <!-- Ties from driver GND/UNO GND to main GND bus -->
  <path class="gnd" d="M 524 980 H 233"/>   <!-- UNO GND meets bus -->
  <path class="gnd" d="M 766 960 H 100"/>   <!-- Driver GND meets bus -->

  <!-- Legend -->
  <rect x="140" y="870" width="560" height="170" class="box"/>
  <text x="160" y="895" class="legend">Legend</text>
  <text x="160" y="918" class="legend">Red = +12V Power bus</text>
  <text x="160" y="938" class="legend">Black = GND bus</text>
  <text x="160" y="958" class="legend">Blue = Logic (D5, D6, D7, D8, 5V)</text>
  <text x="160" y="978" class="legend">Green = Analog (A0 pot wiper)</text>
  <text x="160" y="998" class="legend">Gray = Motor leads (M+, M−)</text>

  <!-- Footer note -->
  <text x="40" y="1040" class="note">Fuse is inline on +12V near PSU. Keep motor leads short (16–18 AWG). Power UNO via USB or buck (share GND). No arrows, no crossings.</text>
</svg>
